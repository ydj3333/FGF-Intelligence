<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FGF Intelligence — Live Candidate</title><style>
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#08111f;color:#edf4ff}header{padding:28px 5vw;border-bottom:1px solid #20334f;background:#0d1a2c}main{max-width:1280px;margin:auto;padding:24px 5vw}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:22px}@media(max-width:900px){.grid{grid-template-columns:1fr}}input,select{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #314968;background:#0e1b2d;color:#fff;font-size:16px;margin:6px 0}button{padding:11px 16px;border:0;border-radius:10px;background:#76b7ff;color:#06101c;font-weight:800;cursor:pointer;margin:6px 5px 6px 0}.card{background:#0d192b;border:1px solid #243a57;border-radius:14px;padding:16px;margin:12px 0}.tier1{border-color:#4ecb91}.conflict{border-color:#ff956e}.muted{color:#a9b8cf}.claim{font-size:17px;line-height:1.45}.small{font-size:13px}.pill{display:inline-block;border:1px solid #3a5575;border-radius:999px;padding:3px 8px;font-size:12px;margin:2px}.kpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.k{padding:12px 16px;background:#102039;border-radius:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{background:#14243a;color:#dce9f9}.tab.active{background:#76b7ff;color:#06101c}.hidden{display:none}.source{color:#c5d6ff}.warn{background:#2a1915}.hero{padding:20px;border:1px solid #2a4766;border-radius:16px;background:linear-gradient(135deg,#0d1b2e,#10253d)}a{color:#9cc9ff}
</style></head><body><header><h1>🚀 FGF Intelligence</h1><div class="muted">Evidence-first • Tier-1 prioritized • S2 • continuously evolving</div></header><main>
<div id="kpi" class="kpi"></div><div class="tabs"><button class="tab active" onclick="show('ask',this)">Ask FGF</button><button class="tab" onclick="show('recommend',this)">Recommendations</button><button class="tab" onclick="show('knowledge',this)">Knowledge</button><button class="tab" onclick="show('conflicts',this)">Conflicts</button></div>
<section id="ask"><div class="hero"><h2>Ask the game</h2><p class="muted">Ask mechanics, rules, costs, systems, events or strategy. The engine retrieves evidence before answering.</p><input id="q" placeholder="e.g. What happens when a fleet has Major Damage?"/><button onclick="ask()">Ask FGF</button></div><div id="answer"></div></section>
<section id="recommend" class="hidden"><div class="card"><h2>Decision support</h2><input id="rq" placeholder="e.g. What should I prioritize next?"/><select id="obj"><option value="general">General</option><option value="progression">Fast progression</option><option value="f2p">F2P efficiency</option><option value="pvp">PvP / GvG</option><option value="pve">PvE / Events</option><option value="economy">Economy / Trade</option><option value="event">Event optimization</option></select><button onclick="recommend()">Recommend</button></div><div id="recs"></div></section>
<section id="knowledge" class="hidden"><div class="card"><h2>Search knowledge</h2><input id="kq" placeholder="Search claims..."/><button onclick="searchClaims()">Search</button></div><div id="knowledgeResults"></div></section>
<section id="conflicts" class="hidden"><div id="conflictResults"></div></section>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function card(c){return `<div class="card ${String(c['Evidence Tier']||'').startsWith('Tier 1')?'tier1':''}"><div class="claim">${esc(c.Claim)}</div><div class="small"><span class=pill>${esc(c.Category)}</span><span class=pill>${esc(c['Evidence Tier'])}</span><span class=pill>${esc(c.Confidence)}</span><span class=pill>${esc(c.Status)}</span></div><p class="source small">${esc(c.Source)} ${esc(c.Timestamp||'')}</p><p class="muted small">${esc(c.Notes)}</p></div>`}
function show(id,btn){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
async function init(){let h=await fetch('/api/health').then(r=>r.json());document.getElementById('kpi').innerHTML=`<div class=k>Claims <b>${h.claims}</b></div><div class=k>Tier 1 <b>${h.tier1}</b></div><div class=k>Sources <b>${h.sources}</b></div><div class=k>Changes <b>${h.changes}</b></div><div class=k>Open conflicts <b>${h.conflicts}</b></div>`;loadConflicts()}
async function ask(){let q=document.getElementById('q').value.trim();if(!q)return;let a=await fetch('/api/ask?q='+encodeURIComponent(q)).then(r=>r.json());let html=`<div class=card><b>Evidence-ranked response</b><p class=muted>${esc(a.note)}</p></div>`;if(a.critical_conflicts.length)html+=a.critical_conflicts.map(x=>`<div class="card conflict warn"><b>⚠ ${esc(x.Topic)}</b><p>${esc(x['Tier-1 evidence'])}</p><p class=muted>${esc(x.Notes)}</p></div>`).join('');html+=a.results.map(card).join('');document.getElementById('answer').innerHTML=html}
async function recommend(){let q=document.getElementById('rq').value.trim(),o=document.getElementById('obj').value;if(!q)return;let a=await fetch('/api/recommend?q='+encodeURIComponent(q)+'&objective='+o).then(r=>r.json());document.getElementById('recs').innerHTML=`<div class=card><b>Decision support</b><p class=muted>${esc(a.disclaimer)}</p></div>`+a.results.map(card).join('')}
async function searchClaims(){let q=document.getElementById('kq').value.trim();let a=await fetch('/api/claims?q='+encodeURIComponent(q)+'&limit=30').then(r=>r.json());document.getElementById('knowledgeResults').innerHTML=a.results.map(card).join('')}
async function loadConflicts(){let a=await fetch('/api/conflicts').then(r=>r.json());document.getElementById('conflictResults').innerHTML='<h2>Evidence conflicts</h2>'+a.results.map(x=>`<div class="card conflict"><h3>${esc(x.Topic)}</h3><p><b>Tier 1:</b> ${esc(x['Tier-1 evidence'])}</p><p class=muted>${esc(x.Notes)}</p></div>`).join('')}
init();document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});</script></main></body></html>
