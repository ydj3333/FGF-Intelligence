<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FGF Intelligence V5</title><style>body{font-family:system-ui;margin:0;background:#08111f;color:#edf4ff}main{max-width:1100px;margin:auto;padding:30px}input,select,button{padding:12px;margin:5px;border-radius:9px;border:1px solid #39516d;background:#102039;color:#fff}button{background:#76b7ff;color:#06101c;font-weight:700}.card{background:#0d192b;border:1px solid #29425f;border-radius:14px;padding:18px;margin:14px 0}.e{border-left:3px solid #4ecb91;padding-left:12px;margin:10px 0}.muted{color:#a9b8cf}</style></head><body><main><h1>🚀 FGF Intelligence V5</h1><p class=muted>Player State • Calculations • Evidence • Decision Support</p><div class=card><h2>Player State</h2><input id=pid value="default" placeholder="Player ID"><select id=season><option>S1</option><option>S2</option><option>S3</option></select><input id=core type=number value=1 min=1 placeholder="Core"><input id=flag type=number value=1 min=1 placeholder="Flagship level"><button onclick=save()>Save state</button><button onclick=load()>Load state</button><div id=state></div></div><div class=card><h2>Progression Calculator</h2><input id=target type=number value=35 min=1 placeholder="Target Core"><button onclick=prog()>Calculate</button><div id=pout></div></div><div class=card><h2>Fleet Synergy</h2><select id=style><option>Kinetic</option><option>Beam</option><option>Ion</option></select><select class=c><option value="">Select Champion 1</option></select><select class=c><option value="">Select Champion 2</option></select><select class=c><option value="">Select Champion 3</option></select><button onclick=syn()>Evaluate</button><div id=sout></div></div><div class=card><h2>Next Priority</h2><button onclick=pri()>Generate from player state</button><div id=rout></div></div><div class=card><h2>Evidence Drill-down</h2><input id=q placeholder="Ask for supporting evidence"><button onclick=ev()>Retrieve</button><div id=eout></div></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function j(u,o){let r=await fetch(u,o);let a=await r.json();if(!r.ok)throw Error(a.error||"request failed");return a}
function renderEvidence(xs){return (xs||[]).map(x=>'<div class=e><b>'+esc(x.claim||"")+'</b><div class=muted>'+esc(x.tier||"")+' • '+esc(x.confidence||"")+' • '+esc(x.source||"")+'</div></div>').join("")}
async function save(){let p={player_id:$("pid").value,season:$("season").value,core_level:+$("core").value,flagship_level:+$("flag").value};let a=await j("/api/v5/player",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});$("state").innerHTML='<p>Saved. Durable: '+a.durable+'</p>'}
async function load(){let a=await j("/api/v5/player?player_id="+encodeURIComponent($("pid").value));let p=a.profile;$("season").value=p.season;$("core").value=p.core_level;$("flag").value=p.flagship_level;$("state").innerHTML='<p>Loaded current player state.</p>'}
async function prog(){let a=await j("/api/v5/progression?core_level="+$("core").value+"&target_level="+$("target").value+"&season="+$("season").value);$("pout").innerHTML='<p><b>Levels:</b> '+a.levels+' | <b>Exact cost:</b> '+a.exact_cost_status+'</p>'+(a.known_milestones||[]).map(x=>'<div class=e>'+esc(x.claim)+'<div class=muted>'+esc(x.tier)+' • '+esc(x.confidence)+'</div></div>').join('')+'<p class=muted>'+esc(a.cost_note)+'</p>'}
async function syn(){let cs=[...document.querySelectorAll(".c")].map(x=>x.value);let u="/api/v5/synergy?style="+$("style").value+cs.map(x=>"&champion="+encodeURIComponent(x)).join("");let a=await j(u);$("sout").innerHTML='<h3>Established synergy: '+a.synergy_bonus_percent+'%</h3><p>Matched: '+a.matched.join(", ")+'</p><p class=muted>'+esc(a.note)+'</p>'}
async function pri(){let a=await j("/api/v5/priority?player_id="+encodeURIComponent($("pid").value));$("rout").innerHTML=(a.priorities||[]).map(x=>'<div class=e><b>'+esc(x.priority)+'</b><p>'+esc(x.reason)+'</p><div class=muted>'+esc(x.evidence)+'</div></div>').join("")}
async function ev(){let a=await j("/api/v5/evidence?q="+encodeURIComponent($("q").value));$("eout").innerHTML=renderEvidence(a.results)}
async function loadChampionSelectors(){
 try{
  const a=await j("/api/champions");
  document.querySelectorAll(".c").forEach((s,i)=>{s.innerHTML='<option value="">Select Champion '+(i+1)+'</option>'+(a.champions||[]).map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')});
 }catch(e){$("sout").innerHTML='<p class=muted>Unable to load standardized Champion list.</p>'}
}
loadChampionSelectors();load().catch(()=>{});
</script></main></body></html>
