name: FGF Transcript Processing

on:
  push:
    paths:
      - '.github/workflows/fgf-transcript-processing.yml'
      - 'scripts/process_transcript_queue.py'
      - 'scripts/extract_claims_from_transcript.py'
      - 'scripts/cross_reference_claims.py'
      - 'scripts/update_video_database.py'
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum transcripts to process"
        required: true
        default: "10"
      apply:
        description: "Persist candidate evidence to Supabase"
        type: boolean
        required: true
        default: false
  schedule:
    - cron: "*/15 * * * *"

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FGF_SUPABASE_URL: ${{ secrets.FGF_SUPABASE_URL || vars.FGF_SUPABASE_URL || 'https://qdoixzfkkmvzjfkhzups.supabase.co' }}
      FGF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FGF_SUPABASE_SERVICE_ROLE_KEY || secrets.FGF_SUPABASE_SECRET_KEY }}
      FGF_LLM_API_KEY: ${{ secrets.FGF_LLM_API_KEY }}
      FGF_TRANSCRIPT_BUCKET: fgf-video-transcripts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-processing.txt
      - name: Validate credentials
        run: |
          test -n "$FGF_LLM_API_KEY" || (echo "Missing FGF_LLM_API_KEY" && exit 1)
          test -n "$FGF_SUPABASE_URL" || (echo "Missing FGF_SUPABASE_URL" && exit 1)
          test -n "$FGF_SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing FGF_SUPABASE_SERVICE_ROLE_KEY or FGF_SUPABASE_SECRET_KEY" && exit 1)
      - name: Process transcript queue
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            python scripts/process_transcript_queue.py --limit "${{ inputs.limit || 10 }}" --apply
          else
            python scripts/process_transcript_queue.py --limit "${{ inputs.limit || 10 }}"
          fi
