name: Knowledge Analyzer Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  knowledge-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Knowledge Analyzer tests
        run: python -m unittest tests/test_knowledge_analyzer.py -v
      - name: Analyze full repository corpus
        run: python scripts/run_knowledge_quality.py
