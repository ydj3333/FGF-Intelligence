name: FGF YouTube Intelligence Ingestion

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Zero-based video offset (2nd video = 1)"
        required: true
        default: "1"
      count:
        description: "Number of videos"
        required: true
        default: "10"
      apply:
        description: "Persist candidates to Supabase"
        type: boolean
        required: true
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYLIST_ID: PL2VyftArNQtQ2EbXMAmgwrPH0P4EvBVAR
      FGF_LLM_API_KEY: ${{ secrets.FGF_LLM_API_KEY }}
      FGF_SUPABASE_URL: ${{ secrets.FGF_SUPABASE_URL }}
      FGF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FGF_SUPABASE_SERVICE_ROLE_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-youtube.txt

      - name: Validate required intelligence credentials
        run: |
          test -n "$FGF_LLM_API_KEY" || (echo "Missing FGF_LLM_API_KEY secret" && exit 1)
          test -n "$FGF_SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing FGF_SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)

      - name: Run batch
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python scripts/process_video_playlist.py               --playlist-id "$PLAYLIST_ID"               --start "${{ inputs.start }}"               --count "${{ inputs.count }}"               --batch-size 10               --apply
          else
            python scripts/process_video_playlist.py               --playlist-id "$PLAYLIST_ID"               --start "${{ inputs.start }}"               --count "${{ inputs.count }}"               --batch-size 10               --dry-run
          fi
