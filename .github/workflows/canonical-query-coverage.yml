name: FGF Canonical Query Coverage

on:
  push:
    branches:
      - main
      - feature/canonical-query-coverage-benchmark
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  canonical-query-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run canonical query coverage gate
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_canonical_query_coverage.py
