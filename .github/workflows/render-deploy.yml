name: Deploy FGF Intelligence to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for Render health
        run: |
          set -euo pipefail
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://fgf-intelligence.onrender.com/api/health || true)
            if [ "$code" = "200" ]; then
              echo "Render health endpoint is responding."
              exit 0
            fi
            echo "Waiting for Render... HTTP $code"
            sleep 10
          done
          echo "Render did not become healthy within the wait window."
          exit 1
