name: Publish FGF app

# Builds the installable FGF Intelligence app from the live knowledge data and
# publishes it to GitHub Pages. Also deploys the free AI proxy (Cloudflare
# Worker + Google Gemini) when its secrets are configured.
#
# Runs automatically:
#   - after every "FGF Corpus Synchronization" run (fresh game data every 6 h)
#   - on pushes to main that touch the app, the proxy or the data
#   - once a day as a safety net
#
# One-time setup: see SITE_SETUP.md.
#   Secrets (Settings > Secrets and variables > Actions):
#     GEMINI_API_KEY          free key from Google AI Studio
#     CLOUDFLARE_API_TOKEN    Cloudflare token with "Edit Cloudflare Workers" permission
#     CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard
#     GROQ_API_KEY            optional backup AI (free Groq key)
#     FGF_ADMIN_PASSWORD      optional: 12+ characters, switches on the review page (admin.html)
#     FGF_GITHUB_DISPATCH_TOKEN optional: fine-grained token (this repo, Actions: read & write) for "Publish now"
#     FGF_SUPABASE_PUBLISHABLE_KEY  optional: lets the proxy store player feedback with insert-only rights
#                                   (otherwise the existing Supabase secret key is used)
#   Variables (optional): FGF_SITE_ORIGIN for a custom domain, FGF_AI_ENDPOINT to use an existing proxy.

on:
  workflow_run:
    workflows: ["FGF Corpus Synchronization"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "worker/**"
      - "data/knowledge.json"
      - "data/verified_guides.json"
      - "operational_intelligence.py"
      - "claim_lifecycle.py"
      - ".github/workflows/publish-app.yml"
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fgf-app-publish
  cancel-in-progress: false

jobs:
  ai-proxy:
    name: Deploy free AI proxy
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the proxy
        run: |
          node worker/test/worker.test.mjs
          node worker/test/admin.test.mjs

      - name: Check setup
        id: setup
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
          GROQ: ${{ secrets.GROQ_API_KEY }}
          OWNER: ${{ github.repository_owner }}
          CUSTOM_ORIGIN: ${{ vars.FGF_SITE_ORIGIN }}
        run: |
          origin="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io"
          if [ -n "$CUSTOM_ORIGIN" ]; then origin="$origin,$CUSTOM_ORIGIN"; fi
          echo "origins=$origin" >> "$GITHUB_OUTPUT"
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && { [ -n "$GEMINI" ] || [ -n "$GROQ" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AI proxy not configured yet (needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and GEMINI_API_KEY). The app will publish with instant answers."
          fi
          [ -n "$GROQ" ] && echo "groq=true" >> "$GITHUB_OUTPUT" || echo "groq=false" >> "$GITHUB_OUTPUT"
          [ -n "$GEMINI" ] && echo "gemini=true" >> "$GITHUB_OUTPUT" || echo "gemini=false" >> "$GITHUB_OUTPUT"

      - name: Deploy proxy to Cloudflare
        id: deploy
        if: steps.setup.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --var ALLOWED_ORIGINS:${{ steps.setup.outputs.origins }} --var SUPABASE_URL:${{ secrets.FGF_SUPABASE_URL || vars.FGF_SUPABASE_URL || 'https://qdoixzfkkmvzjfkhzups.supabase.co' }} --var GITHUB_REPO:${{ github.repository }}

      - name: Store AI keys in the proxy (never in the site)
        if: steps.setup.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Player feedback (learning loop): the publishable key is preferred, because the
          # app_feedback policy lets it insert only. Falls back to the secret key.
          FEEDBACK_KEY: ${{ secrets.FGF_SUPABASE_PUBLISHABLE_KEY || secrets.FGF_SUPABASE_SECRET_KEY || secrets.FGF_SUPABASE_SERVICE_ROLE_KEY }}
          # Review page (admin.html): only enabled when the owner sets a password of 12+ characters.
          ADMIN_PASSWORD: ${{ secrets.FGF_ADMIN_PASSWORD }}
          ADMIN_DB_KEY: ${{ secrets.FGF_SUPABASE_SECRET_KEY || secrets.FGF_SUPABASE_SERVICE_ROLE_KEY }}
          DISPATCH_TOKEN: ${{ secrets.FGF_GITHUB_DISPATCH_TOKEN }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@3 secret put GEMINI_API_KEY; fi
          if [ -n "$GROQ_API_KEY" ]; then printf '%s' "$GROQ_API_KEY" | npx --yes wrangler@3 secret put GROQ_API_KEY; fi
          if [ -n "$FEEDBACK_KEY" ]; then printf '%s' "$FEEDBACK_KEY" | npx --yes wrangler@3 secret put SUPABASE_KEY; fi
          if [ ${#ADMIN_PASSWORD} -ge 12 ] && [ -n "$ADMIN_DB_KEY" ]; then
            printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@3 secret put ADMIN_PASSWORD
            printf '%s' "$ADMIN_DB_KEY" | npx --yes wrangler@3 secret put SUPABASE_ADMIN_KEY
            if [ -n "$DISPATCH_TOKEN" ]; then printf '%s' "$DISPATCH_TOKEN" | npx --yes wrangler@3 secret put GITHUB_DISPATCH_TOKEN; fi
            echo "Review page enabled."
          elif [ -n "$ADMIN_PASSWORD" ]; then
            echo "::warning::FGF_ADMIN_PASSWORD must be at least 12 characters; the review page stays off."
          fi

      - name: Find the proxy address
        id: url
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOY_OUT: ${{ steps.deploy.outputs.command-output }}
          FIXED_URL: ${{ vars.FGF_AI_ENDPOINT }}
        run: |
          url="$FIXED_URL"
          if [ -z "$url" ]; then url="$DEPLOY_URL"; fi
          if [ -z "$url" ]; then url=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -n1 || true); fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then
            for i in 1 2 3 4 5 6; do
              if curl -fsS "$url/health" | grep -q '"ok":true'; then echo "AI proxy healthy at $url"; exit 0; fi
              sleep 5
            done
            echo "::warning::AI proxy at $url did not report healthy yet; the app will retry on each visit."
          fi

  build-and-publish:
    name: Build and publish the app
    needs: ai-proxy
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install icon tool
        run: python -m pip install --quiet pillow
      - name: Add the YouTube evidence (creator videos, unverified)
        env:
          FGF_SUPABASE_URL: ${{ secrets.FGF_SUPABASE_URL || vars.FGF_SUPABASE_URL || 'https://qdoixzfkkmvzjfkhzups.supabase.co' }}
          FGF_SUPABASE_SECRET_KEY: ${{ secrets.FGF_SUPABASE_SECRET_KEY || secrets.FGF_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/export_video_evidence.py
      - name: Build the app from the live knowledge data
        env:
          FGF_AI_ENDPOINT: ${{ needs.ai-proxy.outputs.url }}
        run: python site/build_site.py --repo . --out site/dist
      - name: Test search and fact-check on the built data
        run: FGF_DATA="$PWD/site/dist/fgf-data.json" node site/tests/engine.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: Publish to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
