name: FGF v6.3 Experiential Architecture Tests

on:
  push:
    branches:
      - feature/v6.3-live-experiential-intelligence
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-v63:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run v6.3 architecture tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_v63_experiential_architecture.py
