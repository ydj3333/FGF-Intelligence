name: v8 AI agent

on:
  push:
    branches: [main, "feature/fgf-v8-**"]
    paths: ["fgf_agent/**", "agent.py", "constraint_extractor.py", "operational_intelligence.py", "web/index.html", "tests/test_fgf_agent.py", "tests/test_constraint_extractor*.py", "scripts/run_v8_agent_benchmark.py", ".github/workflows/v8-ai-agent.yml"]
  pull_request:
    paths: ["fgf_agent/**", "agent.py", "constraint_extractor.py", "operational_intelligence.py", "web/index.html", "tests/test_fgf_agent.py", "tests/test_constraint_extractor*.py", "scripts/run_v8_agent_benchmark.py", ".github/workflows/v8-ai-agent.yml"]
  workflow_dispatch:
    inputs:
      limit:
        description: "Questions to run in the live agent benchmark (0 = all 50)"
        default: "0"

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m py_compile agent.py v5_extension.py constraint_extractor.py operational_intelligence.py fgf_agent/*.py scripts/run_v8_agent_benchmark.py
      # No API key needed: scripted model + local mock Anthropic/OpenAI servers.
      - run: pytest -q tests/test_fgf_agent.py tests/test_constraint_extractor.py tests/test_constraint_extractor_full_roster.py

  live-agent-benchmark:
    # Paid LLM calls: manual trigger only. Fails if no key is configured, so a
    # release cannot be signed off without actually evaluating the agent.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: offline-tests
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FGF_LLM_PROVIDER: ${{ vars.FGF_LLM_PROVIDER }}
      FGF_LLM_API_KEY: ${{ secrets.FGF_LLM_API_KEY }}
      FGF_LLM_BASE_URL: ${{ vars.FGF_LLM_BASE_URL }}
      FGF_AGENT_MODEL: ${{ vars.FGF_AGENT_MODEL }}
      FGF_REQUIRE_AGENT_EVAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/run_v8_agent_benchmark.py --limit "${{ github.event.inputs.limit }}" --out reports/v8_agent_benchmark.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-agent-benchmark-${{ github.sha }}
          path: reports/v8_agent_benchmark.json
