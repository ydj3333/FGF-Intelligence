# FGF AI proxy (Cloudflare Workers, free plan). Deployed by .github/workflows/publish-site.yml.
name = "fgf-ai"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
# Overridden at deploy time with your GitHub Pages address (https://<owner>.github.io).
ALLOWED_ORIGINS = ""
# Free Gemini models, tried in order; the next is used automatically when one is busy or out of quota.
GEMINI_MODELS = "gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash-lite"
GROQ_MODELS = "openai/gpt-oss-120b,llama-3.3-70b-versatile"
