name: FGF v6.5 Intelligence Regression Tests

on:
  push:
    branches:
      - main
      - feature/v6-5-video-event-retrieval
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-v63:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run v6.3/v6.4/v6.5 architecture, operational and video tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_v63_experiential_architecture.py tests/test_v64_operational_intelligence.py tests/test_v65_video_retrieval.py
